      <figure style="position:absolute;top:50%;left:50%;width:420px;height:300px;margin:0;transform-origin:center;background:#ffffff;border:2px solid #201e1d;overflow:hidden;display:flex;flex-direction:column">

      </figure>

      <figure style="position:absolute;top:50%;left:50%;width:420px;height:300px;margin:0;transform-origin:center;background:#ffffff;border:2px solid #201e1d;overflow:hidden;display:flex;flex-direction:column">
        <div style="position:relative;flex:1;min-height:0">

      <figure style="position:absolute;top:50%;left:50%;width:420px;height:300px;margin:0;transform-origin:center;background:#ffffff;border:2px solid #201e1d;overflow:hidden;display:flex;flex-direction:column">
        <div style="position:relative;flex:1;min-height:0">
          <image-slot id="cert-secundario" src="../assets/certs/secundario.jpg" shape="rect" fit="contain" placeholder="Diploma del secundario"></image-slot>

        <figcaption style="display:flex;flex-direction:column;align-items:flex-start;gap:2px;height:54px;box-sizing:border-box;overflow:hidden;padding:8px 10px;border-top:2px solid #201e1d;font-size:11px;line-height:1.25">

        </div>
        <figcaption style="display:flex;flex-direction:column;align-items:flex-start;gap:2px;height:54px;box-sizing:border-box;overflow:hidden;padding:8px 10px;border-top:2px solid #201e1d;font-size:11px;line-height:1.25">

      <figure style="position:absolute;top:50%;left:50%;width:420px;height:300px;margin:0;transform-origin:center;background:#ffffff;border:2px solid #201e1d;overflow:hidden;display:flex;flex-direction:column">

        <figcaption style="display:flex;flex-direction:column;align-items:flex-start;gap:2px;height:54px;box-sizing:border-box;overflow:hidden;padding:8px 10px;border-top:2px solid #201e1d;font-size:11px;line-height:1.25">

  <footer style="display:grid;grid-template-columns:auto 1fr auto;gap:16px 24px;align-items:center;padding:14px 48px 32px;border-top:2px solid #201e1d">

      <button onClick="{{ prev }}" style="font-family:inherit;font-size:12px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;text-align:left;padding:10px 18px;border:2px solid #201e1d;border-right-width:1px;background:#f3f2f2;color:#201e1d;cursor:pointer" style-hover="background:#201e1d;color:#f3f2f2">Anterior</button>
      <button onClick="{{ next }}" style="font-family:inherit;font-size:12px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;text-align:left;padding:10px 18px;border:2px solid #201e1d;border-left-width:1px;background:#201e1d;color:#f3f2f2;cursor:pointer" style-hover="background:#ec3013;border-color:#ec3013">Siguiente</button>
    </div>
    <span style="font-size:12px;color:#4a4644">Arrastrá, usá la rueda del mouse o las flechas del teclado. Tocá "Ampliar" para ver el certificado en tamaño completo.</span>
    <div style="display:flex;gap:16px;align-items:center">
      <button onClick="{{ zoom }}" style="font-family:inherit;font-size:12px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;padding:10px 18px;border:2px solid #201e1d;background:#f3f2f2;color:#201e1d;cursor:pointer" style-hover="background:#201e1d;color:#f3f2f2">Ampliar</button>
      <span style="font-size:12px;font-weight:600;letter-spacing:0.08em">{{ counter }}</span>
    </div>
  </footer>

  <sc-if value="{{ zoomSrc }}" hint-placeholder-val="{{ false }}">
    <div onClick="{{ closeZoom }}" style="position:fixed;inset:0;z-index:1000;background:rgba(32,30,29,0.92);display:flex;align-items:center;justify-content:center;padding:24px;cursor:zoom-out">
      {{ zoomImg }}
      <span style="position:absolute;top:18px;right:24px;font-size:12px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:#f3f2f2">Cerrar · Esc</span>
    </div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { index: 0, zoomSrc: null };
    this.stageRef = React.createRef();
    this.trackRef = React.createRef();
    this.count = 0;
    this.drag = null;
    this.wheelLock = 0;
  }

  componentDidMount() {
    this.cards = Array.from(this.trackRef.current.children);
    this.count = this.cards.length;
    this.layout();
    this.onResize = () => this.layout();
    window.addEventListener('resize', this.onResize);

    const stage = this.stageRef.current;
    stage.addEventListener('pointerdown', this.onDown = (e) => {
      if (e.target.closest('image-slot')) return;
      this.drag = { x: e.clientX, start: this.state.index };
      stage.style.cursor = 'grabbing';
      stage.setPointerCapture(e.pointerId);
    });
    stage.addEventListener('pointermove', this.onMove = (e) => {
      if (!this.drag) return;
      const dx = e.clientX - this.drag.x;
      this.go(this.drag.start - Math.round(dx / 180));
    });
    stage.addEventListener('pointerup', this.onUp = () => {
      this.drag = null;
      stage.style.cursor = 'grab';
    });
    stage.addEventListener('wheel', this.onWheel = (e) => {
      const d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
      if (Math.abs(d) < 8) return;
      const now = Date.now();
      if (now - this.wheelLock < 220) return;
      this.wheelLock = now;
      this.go(this.state.index + (d > 0 ? 1 : -1));
    }, { passive: true });
    window.addEventListener('keydown', this.onKey = (e) => {
      if (e.key === 'Escape') return this.setState({ zoomSrc: null });
      if (this.state.zoomSrc) return;
      if (e.key === 'ArrowRight') this.go(this.state.index + 1);
      if (e.key === 'ArrowLeft') this.go(this.state.index - 1);
    });
  }

  componentWillUnmount() {
    window.removeEventListener('resize', this.onResize);
    window.removeEventListener('keydown', this.onKey);
  }

  componentDidUpdate() { this.layout(); }

  go(i) {
    const n = this.cards ? this.cards.length : 1;
    const next = Math.max(0, Math.min(n - 1, i));
    if (next !== this.state.index) this.setState({ index: next });
  }

  layout() {
    if (!this.cards) return;
    const stage = this.stageRef.current;
    const stageW = stage.offsetWidth;
    const stageH = stage.offsetHeight;
    let cardH = Math.max(220, stageH - 40);
    let cardW = Math.round((cardH - 54) * 1.4142); // hoja A4 horizontal + pie de foto
    const maxW = stageW * 0.78;
    if (cardW > maxW) { cardW = Math.round(maxW); cardH = Math.round(cardW / 1.4142 + 54); }
    const step = Math.max(cardW * 0.66, Math.min(340, stageW * 0.2));
    this.cards.forEach((card) => { card.style.width = cardW + 'px'; card.style.height = cardH + 'px'; });
    this.cards.forEach((card, i) => {
      const o = i - this.state.index;
      const a = Math.abs(o);
      const x = o * step;
      const rot = Math.max(-52, Math.min(52, -o * 34));
      const z = -a * 170;
      const scale = a === 0 ? 1 : Math.max(0.7, 1 - a * 0.07);
      card.style.transition = 'transform 420ms cubic-bezier(.22,.61,.36,1), opacity 420ms ease';
      card.style.transform =
        'translate(-50%,-50%) translateX(' + x + 'px) translateZ(' + z + 'px) rotateY(' + rot + 'deg) scale(' + scale + ')';
      card.style.opacity = a > 3 ? 0 : 1;
      card.style.pointerEvents = a > 3 ? 'none' : 'auto';
      card.style.zIndex = String(100 - a);
      card.style.boxShadow = a === 0 ? '0 18px 40px rgba(32,30,29,0.18)' : 'none';
    });
  }

  renderVals() {
    const total = this.cards ? this.cards.length : 7;
    return {
      stageRef: this.stageRef,
      trackRef: this.trackRef,
      zoomSrc: this.state.zoomSrc,
      zoomImg: this.state.zoomSrc ? React.createElement('img', { src: this.state.zoomSrc, alt: '', style: { maxWidth: '100%', maxHeight: '100%', objectFit: 'contain', background: '#fff', boxShadow: '0 20px 60px rgba(0,0,0,0.4)' } }) : null,
      zoom: () => {
        const slot = this.cards && this.cards[this.state.index].querySelector('image-slot');
        const img = slot && (slot.shadowRoot ? slot.shadowRoot.querySelector('img') : slot.querySelector('img'));
        const src = (img && img.currentSrc) || (slot && slot.getAttribute('src'));
        if (src) this.setState({ zoomSrc: src });
      },
      closeZoom: () => this.setState({ zoomSrc: null }),
      prev: () => this.go(this.state.index - 1),
      next: () => this.go(this.state.index + 1),
      counter: String(this.state.index + 1).padStart(2, '0') + ' / ' + String(total).padStart(2, '0')
    };
  }
}
</script>
</body>
